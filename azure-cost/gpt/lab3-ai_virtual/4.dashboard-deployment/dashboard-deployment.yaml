## ---------------------------------------------------------------
## STEP 1: Create the frontend namespace
## ---------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
## ---------------------------------------------------------------
## STEP 2: Streamlit Dashboard Deployment
## ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-dashboard
  namespace: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-dashboard
  template:
    metadata:
      labels:
        app: finops-dashboard
    spec:
      containers:
      - name: finops-dashboard
        image: finopsacrmanmas.azurecr.io/finops-dashboard:v1
        ports:
        - containerPort: 8501
        env:
        - name: AI_AGENT_URL
          value: "http://finops-ai-agent-svc.ai.svc.cluster.local"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 20
          periodSeconds: 10
---
## ---------------------------------------------------------------
## STEP 3: ClusterIP Service (exposed via Ingress below)
## ---------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: finops-dashboard-svc
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: finops-dashboard
  ports:
  - port: 80
    targetPort: 8501
