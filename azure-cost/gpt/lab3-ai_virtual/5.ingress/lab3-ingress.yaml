## ---------------------------------------------------------------
## Lab 3 Ingress Rules
##
## Routes:
##   app.manmas.online  -> Streamlit dashboard (frontend namespace)
##   ai.manmas.online   -> LangGraph agent API (ai namespace)
##
## Prerequisites:
##   - cert-manager installed (done in Lab 1)
##   - ingress-nginx installed (done in Lab 1)
##   - DNS A records pointing both domains to your ingress IP
##
## Check your ingress IP:
##   kubectl get svc -n ingress-nginx
## ---------------------------------------------------------------

## Ingress for Streamlit Dashboard (app.manmas.online)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finops-dashboard-ingress
  namespace: frontend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Required for Streamlit websocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
  - hosts:
    - app.manmas.online
    secretName: finops-dashboard-tls
  rules:
  - host: app.manmas.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finops-dashboard-svc
            port:
              number: 80
---
## Ingress for AI Agent API (ai.manmas.online)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finops-ai-agent-ingress
  namespace: ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
  - hosts:
    - ai.manmas.online
    secretName: finops-ai-agent-tls
  rules:
  - host: ai.manmas.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finops-ai-agent-svc
            port:
              number: 80
