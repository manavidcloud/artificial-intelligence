[project]
name = "langchainupdated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manavidcloud", email = "mohamadabdulnavidcloud@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.2",
    "langchain-xai>=1.3.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchainupdated = "langchainupdated:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
