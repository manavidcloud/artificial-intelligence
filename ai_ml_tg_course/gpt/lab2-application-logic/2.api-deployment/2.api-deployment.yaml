apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-api
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-api
  template:
    metadata:
      labels:
        app: finops-api
        azure.workload.identity/use: "true" # Critical for Lab 1 Identity
    spec:
      serviceAccountName: cost-platform-sa # The SA you created in Lab 1
      containers:
      - name: finops-api
        image: finopsacrmanmas.azurecr.io/finops-api:v1
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "finops-pgflex.postgres.database.azure.com"
        - name: DB_PASSWORD
          value: "YourStr0ngPass!" # Use the password from Lab 1
---
apiVersion: v1
kind: Service
metadata:
  name: finops-api-svc
  namespace: platform
spec:
  type: ClusterIP
  selector:
    app: finops-api
  ports:
  - port: 80
    targetPort: 8000