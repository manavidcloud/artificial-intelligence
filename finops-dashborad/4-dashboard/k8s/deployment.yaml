---
# =============================================================================
# FinOps Dashboard — Kubernetes Manifests
# Apply after running apply-secrets.sh:
#   kubectl apply -f 4-dashboard/k8s/deployment.yaml
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-dashboard
  namespace: frontend
  labels:
    app: finops-dashboard
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-dashboard
  template:
    metadata:
      labels:
        app: finops-dashboard
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: finops-dashboard
          image: finopsacrmanmas.azurecr.io/finops-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: PLATFORM_API_URL
              valueFrom:
                secretKeyRef:
                  name: finops-frontend-secret
                  key: PLATFORM_API_URL
            - name: PLATFORM_AI_URL
              valueFrom:
                secretKeyRef:
                  name: finops-frontend-secret
                  key: PLATFORM_AI_URL
            - name: AUTH_MODE
              value: "local"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: users-config
              mountPath: /app/src/users.yaml
              subPath: users.yaml
              readOnly: true
      volumes:
        - name: users-config
          secret:
            secretName: finops-dashboard-users
            optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: finops-dashboard-svc
  namespace: frontend
  labels:
    app: finops-dashboard
spec:
  type: ClusterIP
  selector:
    app: finops-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
