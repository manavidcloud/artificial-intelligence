# OpenCost — Azure AKS cost allocation
# helm upgrade --install opencost opencost/opencost \
#   --namespace opencost \
#   -f 4-dashboard/k8s/opencost-helm-values.yaml

opencost:
  exporter:
    defaultClusterId: "finops-aks"

    # Specify which managed identity OpenCost should use for Rate Card pricing.
    # With multiple MIs on the node, this prevents "multiple user assigned identities" errors.
    extraEnv:
      AZURE_CLIENT_ID: "d081e7e9-c233-463a-9c81-b5746ddf746d"

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    internal:
      enabled: true
      serviceName: prometheus-server
      namespaceName: opencost
      port: 80

  # ── Cloud Cost integration (billing export → cloud-costs K8s secret) ────────
  cloudIntegrationSecret: cloud-costs

  # ── UI ───────────────────────────────────────────────────────────────────────
  ui:
    enabled: true

  metrics:
    serviceMonitor:
      enabled: false

  # ── Cloud Cost feature flag ──────────────────────────────────────────────────
  cloudCost:
    enabled: true
