# =============================================================================
# FinOps Platform — SecretProviderClass (Azure Key Vault CSI Driver)
# =============================================================================
#
# These resources tell the CSI driver which Key Vault secrets to pull and how
# to sync them into Kubernetes Secrets (via secretObjects).
#
# HOW IT WORKS:
#   1. The Secrets Store CSI Driver (installed as AKS addon) watches for pods
#      that mount a "secrets-store" CSI volume.
#   2. When a pod mounts the volume, the driver authenticates to Key Vault using
#      the pod's Workload Identity token and fetches the listed secrets.
#   3. Secrets are written to the pod's filesystem AND synced into the K8s
#      Secret named in secretObjects — so pods using secretKeyRef still work.
#   4. Any rotation in Key Vault is picked up on the next sync cycle (default 2m).
#
# APPLIED BY:
#   apply-secrets.sh calls this file via envsubst to substitute placeholders.
#   Do NOT apply this file directly — MI_CLIENT_ID and TENANT_ID must be set.
#
# MANUAL APPLY:
#   export MI_CLIENT_ID=$(az identity show --name mi-finops-prod \
#     --resource-group rg-finops-prod-core --query clientId -o tsv)
#   export TENANT_ID=$(az account show --query tenantId -o tsv)
#   envsubst '${MI_CLIENT_ID} ${TENANT_ID}' < k8s/secret-provider-class.yaml \
#     | kubectl apply -f -
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Platform namespace — syncs all app secrets → finops-platform-secret
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: finops-kv-platform
  namespace: platform
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${MI_CLIENT_ID}"
    keyvaultName: "kv-finops-prod"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: db-host
          objectType: secret
        - |
          objectName: db-name
          objectType: secret
        - |
          objectName: db-user
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: azure-openai-endpoint
          objectType: secret
        - |
          objectName: azure-openai-deployment
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: mi-client-id
          objectType: secret
        - |
          objectName: azure-subscription-ids
          objectType: secret
        - |
          objectName: smtp-host
          objectType: secret
          objectVersion: ""
        - |
          objectName: smtp-port
          objectType: secret
          objectVersion: ""
        - |
          objectName: smtp-user
          objectType: secret
          objectVersion: ""
        - |
          objectName: smtp-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: smtp-from
          objectType: secret
          objectVersion: ""
        - |
          objectName: alert-recipients
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: finops-platform-secret
      type: Opaque
      data:
        - objectName: db-host
          key: DB_HOST
        - objectName: db-name
          key: DB_NAME
        - objectName: db-user
          key: DB_USER
        - objectName: db-password
          key: DB_PASSWORD
        - objectName: azure-openai-endpoint
          key: AZURE_OPENAI_ENDPOINT
        - objectName: azure-openai-deployment
          key: AZURE_OPENAI_DEPLOYMENT
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
        - objectName: mi-client-id
          key: MI_CLIENT_ID
        - objectName: azure-subscription-ids
          key: AZURE_SUBSCRIPTION_IDS
        - objectName: smtp-host
          key: SMTP_HOST
        - objectName: smtp-port
          key: SMTP_PORT
        - objectName: smtp-user
          key: SMTP_USER
        - objectName: smtp-password
          key: SMTP_PASSWORD
        - objectName: smtp-from
          key: SMTP_FROM
        - objectName: alert-recipients
          key: ALERT_RECIPIENTS

---
# ─────────────────────────────────────────────────────────────────────────────
# AI namespace — syncs OpenAI secrets → finops-ai-secret
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: finops-kv-ai
  namespace: ai
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${MI_CLIENT_ID}"
    keyvaultName: "kv-finops-prod"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: azure-openai-endpoint
          objectType: secret
        - |
          objectName: azure-openai-deployment
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: mi-client-id
          objectType: secret
        - |
          objectName: langsmith-api-key
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: finops-ai-secret
      type: Opaque
      data:
        - objectName: azure-openai-endpoint
          key: AZURE_OPENAI_ENDPOINT
        - objectName: azure-openai-deployment
          key: AZURE_OPENAI_DEPLOYMENT
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
        - objectName: mi-client-id
          key: MI_CLIENT_ID
        - objectName: langsmith-api-key
          key: LANGSMITH_API_KEY

---
# ─────────────────────────────────────────────────────────────────────────────
# Frontend namespace — syncs service URLs → finops-frontend-secret
# (URLs are static so this is mainly for oauth credentials if SSO is enabled)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: finops-kv-frontend
  namespace: frontend
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${MI_CLIENT_ID}"
    keyvaultName: "kv-finops-prod"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: oauth-client-id
          objectType: secret
          objectVersion: ""
        - |
          objectName: oauth-client-secret
          objectType: secret
          objectVersion: ""
  secretObjects:
    - secretName: finops-frontend-secret
      type: Opaque
      data:
        - objectName: oauth-client-id
          key: OAUTH_CLIENT_ID
        - objectName: oauth-client-secret
          key: OAUTH_CLIENT_SECRET
