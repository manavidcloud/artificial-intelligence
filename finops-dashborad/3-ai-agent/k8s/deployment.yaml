---
apiVersion: v1
kind: Namespace
metadata:
  name: ai
  labels:
    azure.workload.identity/use: "true"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-ai-sa
  namespace: ai
  annotations:
    azure.workload.identity/use: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-ai-agent
  namespace: ai
  labels:
    app: finops-ai-agent
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-ai-agent
  template:
    metadata:
      labels:
        app: finops-ai-agent
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cost-ai-sa
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: finops-ai-agent
      containers:
        - name: finops-ai-agent
          image: finopsacr.azurecr.io/finops-ai-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: finops-ai-secret
                  key: AZURE_OPENAI_ENDPOINT
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: finops-ai-secret
                  key: AZURE_OPENAI_DEPLOYMENT
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finops-ai-secret
                  key: AZURE_OPENAI_API_KEY
                  optional: true
            - name: MI_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: finops-ai-secret
                  key: MI_CLIENT_ID
            - name: PLATFORM_API_URL
              value: "http://finops-platform-api-svc.platform.svc.cluster.local"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: finops-ai-agent-svc
  namespace: ai
  labels:
    app: finops-ai-agent
spec:
  type: ClusterIP
  selector:
    app: finops-ai-agent
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
