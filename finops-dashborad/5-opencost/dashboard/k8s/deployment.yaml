# =============================================================================
# K8s Cost Dashboard (OpenCost Streamlit) — Kubernetes Manifests
# OPTIONAL COMPONENT
#
# Prerequisites:
#   - OpenCost + Prometheus deployed in `opencost` namespace (see 5-opencost/README.md)
#   - ACR login and image pushed:
#       ACR="finopsacrmanmas.azurecr.io"
#       docker buildx build --platform linux/amd64 --push \
#         -t $ACR/opencost-dashboard:latest 5-opencost/dashboard/
#
# Usage:
#   kubectl apply -f 5-opencost/dashboard/k8s/deployment.yaml
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost-dashboard
  namespace: opencost
  labels:
    app: opencost-dashboard
    component: k8s-cost-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencost-dashboard
  template:
    metadata:
      labels:
        app: opencost-dashboard
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: opencost-dashboard
          image: finopsacrmanmas.azurecr.io/opencost-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8502
              protocol: TCP
          env:
            - name: OPENCOST_URL
              # OpenCost service within the same namespace
              value: "http://opencost.opencost.svc.cluster.local:9090"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8502
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8502
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: opencost-dashboard-svc
  namespace: opencost
  labels:
    app: opencost-dashboard
spec:
  type: ClusterIP
  selector:
    app: opencost-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8502
      protocol: TCP
